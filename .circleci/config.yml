version: 2.1

jobs:
  build_test:
    docker:
      - image: cimg/python:3.12
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:HmYbwDJ6JLfaT7Oad5vLzshdvLlxFCv+esCcsd+UgQ0"
      - checkout

      - run:
          name: Install build tools (build_test)
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip 'setuptools>=69.0.0,<70.0.0' wheel build

      - run:
          name: Build (build_test)
          command: |
            . venv/bin/activate
            python -m build

      - run:
          name: Check if wheel file exists (build_test)
          command: ls -l dist/

      - run:
          name: Set wheel filename (build_test)
          command: |
            export WHL_FILENAME=$(ls dist/*.whl)
            echo "WHEEL FILE: $WHL_FILENAME"

      - run:
          name: Install dependencies (build_test)
          command: |
            . venv/bin/activate
            pip install -r requirements.txt

      - run:
          name: Install package (build_test)
          command: |
            . venv/bin/activate
            export WHL_FILENAME=$(ls dist/*.whl)
            pip install $WHL_FILENAME

      - run:
          name: Check that the installed package is the checked-out code (build_test)
          command: |
            . venv/bin/activate
            python ci/check_installed_package.py

      - run:
          name: Install pytest (build_test)
          command: |
            . venv/bin/activate
            pip install pytest

      # The map tests never download: the Natural Earth files of
      # tests/data/naturalearth_manifest.tsv are fetched here, checked against
      # their sha256, and given to the tests through CARTOPY_DATA_DIR.
      - run:
          name: Provide the verified Natural Earth data (build_test)
          command: |
            . venv/bin/activate
            python ci/fetch_naturalearth.py ~/naturalearth

      - run:
          name: Run Tests (build_test)
          command: |
            . venv/bin/activate
            CARTOPY_DATA_DIR=~/naturalearth pytest -ra

      - store_test_results:
          path: test-reports

  test_pypi_publish:
    docker:
      - image: cimg/python:3.12
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:HmYbwDJ6JLfaT7Oad5vLzshdvLlxFCv+esCcsd+UgQ0"
      - checkout

      - run:
          name: Install build tools (test_pypi_publish)
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip 'setuptools>=69.0.0,<70.0.0' wheel build

      - run:
          name: Create whl (test_pypi_publish)
          command: |
            . venv/bin/activate
            python -m build

      - run:
          name: Check if wheel file exists (test_pypi_publish)
          command: ls -l dist/

      - run:
          name: Install dependencies (test_pypi_publish)
          command: |
            . venv/bin/activate
            pip install -r requirements.txt

      - run:
          name: Install twine (test_pypi_publish)
          command: |
            . venv/bin/activate
            pip install 'twine>=3.0.0,<4.0.0'

      - run:
          name: Publish on TestPyPI
          command: |
            . venv/bin/activate
            twine upload -u ${TESTPYPI_USERNAME} -p ${TESTPYPI_PASSWORD} --repository testpypi dist/* --verbose --skip-existing

  pypi_publish:
    docker:
      - image: cimg/python:3.12
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:HmYbwDJ6JLfaT7Oad5vLzshdvLlxFCv+esCcsd+UgQ0"
      - checkout

      - run:
          name: Install build tools (pypi_publish)
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip 'setuptools>=69.0.0,<70.0.0' wheel build

      - run:
          name: Create whl (pypi_publish)
          command: |
            . venv/bin/activate
            python -m build

      - run:
          name: Check if wheel file exists (pypi_publish)
          command: ls -l dist/

      - run:
          name: Install dependencies (pypi_publish)
          command: |
            . venv/bin/activate
            pip install -r requirements.txt

      - run:
          name: Install twine (pypi_publish)
          command: |
            . venv/bin/activate
            pip install 'twine>=3.0.0,<4.0.0'

      - run:
          name: Publish on PyPI
          command: |
            . venv/bin/activate
            twine upload -u ${PYPI_USERNAME} -p ${PYPI_PASSWORD} dist/* --verbose --skip-existing

# Publishing runs only when a pipeline is triggered explicitly with one of these
# parameters set to true (CircleCI: "Trigger Pipeline"); pushes and pull
# requests never publish.
parameters:
  publish_testpypi:
    type: boolean
    default: false
  publish_pypi:
    type: boolean
    default: false

workflows:
  build_test:
    when:
      not:
        or:
          - << pipeline.parameters.publish_testpypi >>
          - << pipeline.parameters.publish_pypi >>
    jobs:
      - build_test
  publish_testpypi:
    when: << pipeline.parameters.publish_testpypi >>
    jobs:
      - build_test
      - test_pypi_publish:
          requires:
            - build_test
          filters:
            branches:
              only:
                - develop
  publish_pypi:
    when: << pipeline.parameters.publish_pypi >>
    jobs:
      - build_test
      - pypi_publish:
          requires:
            - build_test
          filters:
            branches:
              only:
                - main
