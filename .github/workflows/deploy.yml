name: Deploy to GitHub Pages

# Publishes the documentation to GitHub Pages: run it explicitly (Actions tab,
# "Run workflow"); pushes and pull requests never publish.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12.4'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install sphinx sphinx_rtd_theme ghp-import  # Ensure Sphinx, the theme, and ghp-import are installed

    - name: Build documentation
      run: |
        cd docs
        make html

    - name: Deploy to GitHub Pages
      run: |
        ghp-import -n -p -f docs/build/html
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
