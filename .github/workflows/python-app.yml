name: Python application

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip build
        pip install -r requirements.txt

    - name: Build and install the LorenzCycleToolkit wheel
      run: |
        python -m build --wheel
        pip install --no-deps dist/*.whl
        pip check

    - name: Check that the installed package is the checked-out code
      run: python ci/check_installed_package.py

    - name: Set up PYTHONPATH
      run: echo "PYTHONPATH=$GITHUB_WORKSPACE/src" >> $GITHUB_ENV

    # Read only: no tool rewrites the code before the tests.
    - name: Lint with flake8
      run: |
        flake8 . --config .flake8 --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --config .flake8 --count --exit-zero --max-complexity=10 --statistics

    # The map tests never download: the Natural Earth files of
    # tests/data/naturalearth_manifest.tsv are fetched here, checked against
    # their sha256, and given to the tests through CARTOPY_DATA_DIR.
    - name: Provide the verified Natural Earth data
      run: |
        python ci/fetch_naturalearth.py "$RUNNER_TEMP/naturalearth"
        echo "CARTOPY_DATA_DIR=$RUNNER_TEMP/naturalearth" >> $GITHUB_ENV

    - name: Test with pytest
      run: |
        pytest -ra
