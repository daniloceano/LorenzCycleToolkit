[build-system]
requires = ["setuptools>=69.0.0,<70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lorenzcycletoolkit"
version = "2.0.0"
description = "A toolkit for calculating the Lorenz Energy Cycle in atmospheric systems"
readme = "README.md"
authors = [
    {name = "Danilo Couto de Souza", email = "danilo.oceano@gmail.com"}
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "cartopy>=0.21.0",
    "cdsapi>=0.5.1",
    "cmocean>=4.0.3",
    # src/utils/cyclophaser_compat.py accepts only the tested version
    "cyclophaser==1.7.3",
    "dask>=2024.7.0",
    "lorenz-phase-space>=1.2.4",
    "matplotlib>=3.5.0",
    "metpy>=1.3.0",
    "netCDF4>=1.5.8",
    "numpy>=1.22.0",
    "pandas>=1.4.0",
    "pint>=0.19",
    "scipy>=1.8.0",
    "shapely>=2.0.5",
    "xarray>=2022.3.0",
]

[project.optional-dependencies]
# --wekeo (WEkEO HDA route, src/utils/wekeo_hda.py); 2.40 is the tested version
wekeo = ["hda>=2.40", "requests>=2.5.0"]
# --arco (CDS ARCO Zarr route, src/utils/arco_zarr.py); zarr 3 is not supported, numcodecs 0.16 breaks zarr 2.18
arco = ["zarr>=2.16,<3", "numcodecs>=0.11,<0.16", "fsspec>=2024.6.1", "aiohttp>=3.9"]
# --destine (DestinE Earth Data Hub Zarr v2 route, src/utils/destine_edh.py); same packages as [arco]
destine = ["zarr>=2.16,<3", "numcodecs>=0.11,<0.16", "fsspec>=2024.6.1", "aiohttp>=3.9"]

[project.urls]
Documentation = "https://lorenzcycletoolkit.readthedocs.io/"
Source = "https://github.com/daniloceano/LorenzCycleToolkit"
Tracker = "https://github.com/daniloceano/LorenzCycleToolkit/issues"

[project.scripts]
lorenzcycletoolkit = "lorenzcycletoolkit:main"

[tool.setuptools]
packages = ["src", "src.analysis", "src.frameworks", "src.plots", "src.utils", "tests"]
py-modules = ["lorenzcycletoolkit"]
